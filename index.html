<!DOCTYPE html>
<html lang="en" ng-app="pcSolutionsApp">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PC Solutions</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- ONLY Custom CSS (Bootstrap Removed) -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body ng-controller="MainController">

    <div class="container">

        <!-- Masthead and Navigation -->
        <header class="site-header">
            <h1 class="logo">PC Solutions <small>Fast. Reliable. Local.</small></h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-image">
                <img ng-src="{{ mainImage }}" alt="Laptop">
            </div>
            <div class="hero-text">
                <h2>PC Solutions</h2>
                <p class="lead">{{ heroDescription }}</p>
            </div>
        </section>

        <!-- Services Section -->
        <section class="services-section">
            <div class="services-grid">
                <div class="service-card" ng-repeat="service in services">
                    <h3>{{ service.title }}</h3>
                    <p>{{ service.description }}</p>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="site-footer">
            <p>&copy; {{ currentYear }} PC Solutions. All rights reserved.</p>
        </footer>

    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
